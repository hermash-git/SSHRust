[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/terminal",
    "crates/vault",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
iced = "=0.14.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
